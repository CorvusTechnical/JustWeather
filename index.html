    <!-- Load HA WebSocket Bus Module -->
<script src="haws.umd.js"></script>
<script type="module">

	const HASS_URL    = location.origin //'http://192.168.1.175:8123';
	const OTEMP_ENTITY = "sensor.gw2000b_wifi408f_outdoor_temperature";
	const ITEMP_ENTITY = "sensor.gw2000b_wifi408f_t_h_temp_ch1";
	const ABSPRES_ENTITY = "sensor.gw2000b_wifi408f_absolute_pressure";
	

	async function startHA() {
	let auth;
	try {
		auth = await HAWS.getAuth({ hassUrl: HASS_URL });
	} catch (err) {
	console.error("Auth failed:", err, "| hassUrl:", HASS_URL);
	return;
	}

	const conn = await HAWS.createConnection({ auth });

	HAWS.subscribeEntities(conn, (entities) => {
		var date = new Date();
		const ot = entities[OTEMP_ENTITY];
		if (!ot) return;
		const no = parseFloat(ot.state);
		document.getElementById("outTemp").innerText = isNaN(no)
		? "--"
		: Math.round(no);

		const it = entities[ITEMP_ENTITY];
		if (!it) return;
		const ni = parseFloat(it.state);
		document.getElementById("inTemp").innerText = isNaN(ni)
		? "--"
		: Math.round(ni);

		const ap = entities[ABSPRES_ENTITY];
		if (!ap) return;
			const np = parseFloat(ap.state);
			document.getElementById("pressure").innerText = isNaN(np)
			? "--.--"
			: np;
	});

	const service_data = {
		type: "history/stream", // or "history/during_period" for a fixed historical range
		entity_ids: [ABSPRES_ENTITY],
		start_time: "2026-10-27T00:00:00.000Z", // Must be an ISO 8601 string
		minimal_response: false,
		no_attributes: true,
		significant_changes_only: false
		};

		// wsconn represents your active, authenticated WebSocket connection
		conn.sendMessagePromise(service_data)
		.then(response => {
			console.log("Historical data retrieved successfully:", response);
		})
		.catch(error => {
			console.error("Failed to fetch history:", error);
		});
		
	
}
	startHA();
	
</script>
